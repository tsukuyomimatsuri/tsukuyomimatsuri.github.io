<style>
:root{
  --sumi:#020612; --moon:#F5E9C8; --gold:#E3C174; --paper:#CBD7E0; --mist:#8497AA;
  --rule:rgba(227,193,116,.24); --rule-soft:rgba(227,193,116,.12);
  --f-jp:"Shippori Mincho B1","Yu Mincho","Hiragino Mincho ProN",serif;
  --f-num:"Cormorant Garamond","Shippori Mincho B1",Georgia,serif;
  --gut:clamp(22px,6vw,56px);
  color-scheme:dark;
}
*{box-sizing:border-box}
body{margin:0;background:var(--sumi);color:var(--paper);font-family:var(--f-jp);
  font-size:clamp(14.5px,.35vw + 13.8px,16px);line-height:2.1;letter-spacing:.06em;
  -webkit-font-smoothing:antialiased;overflow-x:hidden}

/* 夜の層 */
.night{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.night>*{position:absolute;inset:0}
.l-base{background:
  radial-gradient(1100px 820px at 50% -8%, #0C2942 0%, transparent 62%),
  radial-gradient(820px 640px at 14% 44%, rgba(23,54,76,.46) 0%, transparent 68%),
  radial-gradient(760px 620px at 88% 66%, rgba(12,41,66,.42) 0%, transparent 70%),
  linear-gradient(180deg,#050D20 0%,#020612 74%)}
.l-grain{opacity:.16;mix-blend-mode:overlay;background-image:
  radial-gradient(rgba(255,255,255,.5) .5px, transparent .5px);
  background-size:3px 3px}
.l-vig{background:radial-gradient(130% 88% at 50% 38%, transparent 44%, rgba(2,6,18,.82) 100%)}

/* 版面 */
main{position:relative;z-index:1;min-height:100svh;display:flex;flex-direction:column;
  align-items:center;justify-content:center;text-align:center;
  padding:clamp(38px,6.5vh,72px) var(--gut);gap:0}

/* 月 */
.moonfig{display:block;width:clamp(110px,28vw,166px);height:auto;
  margin-bottom:clamp(20px,4.2vw,36px);animation:rise 1.8s cubic-bezier(.2,.7,.2,1) both}
@keyframes rise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}

/* 題字 */
.mark{margin:0;line-height:0;animation:rise 1.8s .2s cubic-bezier(.2,.7,.2,1) both}
.mark svg{width:clamp(186px,46vw,290px);height:auto;color:var(--moon);
  filter:drop-shadow(0 0 26px rgba(245,233,200,.16))}
.vol{margin:clamp(15px,2.8vw,23px) 0 0;font-family:var(--f-num);
  font-size:clamp(1.02rem,3.2vw,1.24rem);letter-spacing:.34em;color:var(--gold);
  animation:rise 1.8s .34s cubic-bezier(.2,.7,.2,1) both}

/* 罫 */
.orn{display:flex;align-items:center;justify-content:center;gap:.8em;width:min(300px,78%);
  margin:clamp(19px,3.8vw,29px) 0;color:var(--gold);
  animation:rise 1.8s .46s cubic-bezier(.2,.7,.2,1) both}
.orn i{flex:1;height:1px;background:linear-gradient(90deg,transparent,var(--rule),transparent)}
.orn b{width:6px;height:6px;transform:rotate(45deg);background:var(--gold);opacity:.72;flex:none}

/* 要目 */
.facts{margin:0;animation:rise 1.8s .58s cubic-bezier(.2,.7,.2,1) both}
.facts .d{margin:0;font-family:var(--f-num);font-size:clamp(1.18rem,4.6vw,1.62rem);
  letter-spacing:.14em;color:var(--moon);font-variant-numeric:tabular-nums;line-height:1.7}
.facts .p{margin:.9em 0 0;font-size:clamp(.92rem,3vw,1rem);letter-spacing:.14em;color:var(--paper)}
.facts .f{margin:.55em 0 0;font-size:.82rem;letter-spacing:.2em;color:var(--gold);opacity:.88}

/* 報せ */
.msg{margin:clamp(25px,4.8vw,39px) 0 0;font-size:clamp(.95rem,3.1vw,1.04rem);
  line-height:2.2;color:var(--paper);
  animation:rise 1.8s .7s cubic-bezier(.2,.7,.2,1) both}
.msg small{display:block;margin-top:.9em;font-size:.84rem;color:var(--mist);letter-spacing:.1em}

/* 導線 */
.ig{display:inline-flex;align-items:center;gap:.7em;margin-top:clamp(23px,4.4vw,34px);
  padding:1.02em 1.7em;border:1px solid var(--rule);background:rgba(227,193,116,.06);
  color:var(--gold);text-decoration:none;font-size:clamp(.9rem,2.9vw,.98rem);letter-spacing:.14em;
  transition:background .3s,border-color .3s,color .3s,transform .35s cubic-bezier(.2,.7,.2,1);
  animation:rise 1.8s .82s cubic-bezier(.2,.7,.2,1) both}
.ig svg{width:17px;height:17px;flex:none}
.ig:hover,.ig:focus-visible{background:rgba(227,193,116,.14);border-color:var(--gold);
  color:#fff;transform:translateY(-2px)}
@media (hover:none){.ig:hover{transform:none}}

.sig{margin:clamp(27px,4.8vw,44px) 0 0;font-size:.78rem;letter-spacing:.24em;color:var(--mist);
  animation:rise 1.8s .94s cubic-bezier(.2,.7,.2,1) both}

/* 横長の画面では一画面に収める */
@media (min-width:861px){
  main{padding-block:clamp(28px,4.6vh,54px)}
  .moonfig{width:clamp(100px,8.6vw,136px);margin-bottom:clamp(15px,1.9vh,27px)}
  .vol{margin-top:clamp(12px,1.6vh,20px)}
  .orn{margin:clamp(15px,2.1vh,25px) 0}
  .msg{margin-top:clamp(19px,2.8vh,33px);line-height:2.05}
  .ig{margin-top:clamp(17px,2.4vh,29px)}
  .sig{margin-top:clamp(19px,2.8vh,37px)}
}

@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
